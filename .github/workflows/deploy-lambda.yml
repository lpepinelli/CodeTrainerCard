name: Deploy Lambda Code

on:
  push:
    branches: [ main ]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-lambda.yml' 

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: Remove dev dependencies
        run: npm prune --omit=dev

      # npm installs every sharp build for the runner's OS; Lambda only loads the glibc one
      - name: Remove unused sharp builds
        run: rm -rf node_modules/@img/*musl* node_modules/@img/sharp-wasm32

      - name: Zip Lambda code
        run: zip -r lambda.zip node_modules dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name developer-trainer-card \
            --zip-file fileb://lambda.zip
