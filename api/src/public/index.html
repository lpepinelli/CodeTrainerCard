<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Roboto", serif;
        }
    </style>
</head>
<body>
    <h1 id="preview"></h1>
    <img id="img-preview" src="http://localhost:3333/api/card/lpepinelli" width="500px">
</body>
<script>
    document.write('<script src="http://' + (location.host || 'localhost').split(':')[0] +
    ':35729/livereload.js?snipver=1"></' + 'script>')

    const defaultEndpoint = '/api/card/lpepinelli'

    document.getElementById('img-preview').src = `${location.origin}${defaultEndpoint}`
    document.getElementById('preview').innerHTML = `SVG Preview - ${defaultEndpoint}`
</script>
</html>
